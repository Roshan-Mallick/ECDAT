name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1)'
        required: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DECDAT_FETCH_DEPENDENCIES=ON \
            -DECDAT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "project(ecdat" CMakeLists.txt -A1 | grep VERSION | sed 's/.*VERSION //' | tr -d ')')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="ECDAT-${VERSION}-linux-x86_64"
          mkdir -p "${STAGING}/bin/resources"
          mkdir -p "${STAGING}/share/ecdat"
          cp build/platform/ecdat "${STAGING}/bin/ecdat"
          chmod +x "${STAGING}/bin/ecdat"
          cp taxonomy/taxonomy/data/taxonomy.yaml "${STAGING}/bin/resources/taxonomy.yaml"
          cp taxonomy/taxonomy/data/taxonomy.yaml "${STAGING}/share/ecdat/taxonomy.yaml"
          tar czf "ECDAT-${VERSION}-linux-x86_64.tar.gz" "${STAGING}/"

      - name: Package .deb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEB_DIR="ecdat_${VERSION}_amd64"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/ecdat"
          cp build/platform/ecdat "${DEB_DIR}/usr/bin/ecdat"
          chmod +x "${DEB_DIR}/usr/bin/ecdat"
          cp taxonomy/taxonomy/data/taxonomy.yaml "${DEB_DIR}/usr/share/ecdat/taxonomy.yaml"
          printf 'Package: ecdat\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nDepends: libc6 (>= 2.31), libstdc++6 (>= 12), libssl3 (>= 3.0)\nMaintainer: ECDAT Project Team\nDescription: Enterprise Cryptography Discovery & Assessment Tool\n ECDAT scans source code, certificates, and TLS configurations to\n identify weak cryptographic algorithms, assess risk levels, and\n provide post-quantum cryptography migration guidance.\n' "${VERSION}" > "${DEB_DIR}/DEBIAN/control"
          chmod 755 "${DEB_DIR}/DEBIAN"
          dpkg-deb --build "${DEB_DIR}" "ecdat_${VERSION}_amd64.deb"

      - name: Validate tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VALIDATION_DIR=$(mktemp -d)
          cd "${VALIDATION_DIR}"
          tar xzf "${{ github.workspace }}/ECDAT-${VERSION}-linux-x86_64.tar.gz"
          ./ECDAT-${VERSION}-linux-x86_64/bin/ecdat --version
          test -f ./ECDAT-${VERSION}-linux-x86_64/bin/resources/taxonomy.yaml
          ./ECDAT-${VERSION}-linux-x86_64/bin/ecdat scan "${{ github.workspace }}"
          rm -rf "${VALIDATION_DIR}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            ECDAT-*-linux-x86_64.tar.gz
            ecdat_*_amd64.deb

  # ---------------------------------------------------------------------------
  # macOS (Apple Silicon arm64 + Intel x86_64)
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: brew install cmake ninja openssl@3

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DECDAT_FETCH_DEPENDENCIES=ON \
            -DECDAT_BUILD_TESTS=ON \
            -DOpenSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Extract version and arch
        id: info
        run: |
          VERSION=$(grep "project(ecdat" CMakeLists.txt -A1 | grep VERSION | sed 's/.*VERSION //' | tr -d ')')
          ARCH=$(uname -m)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          ARCH="${{ steps.info.outputs.arch }}"
          STAGING="ECDAT-${VERSION}-macos-${ARCH}"
          mkdir -p "${STAGING}/bin/resources"
          cp build/platform/ecdat "${STAGING}/bin/ecdat"
          chmod +x "${STAGING}/bin/ecdat"
          cp taxonomy/taxonomy/data/taxonomy.yaml "${STAGING}/bin/resources/taxonomy.yaml"
          tar czf "ECDAT-${VERSION}-macos-${ARCH}.tar.gz" "${STAGING}/"

      - name: Validate tarball
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          ARCH="${{ steps.info.outputs.arch }}"
          VALIDATION_DIR=$(mktemp -d)
          cd "${VALIDATION_DIR}"
          tar xzf "${{ github.workspace }}/ECDAT-${VERSION}-macos-${ARCH}.tar.gz"
          ./ECDAT-${VERSION}-macos-${ARCH}/bin/ecdat --version
          test -f ./ECDAT-${VERSION}-macos-${ARCH}/bin/resources/taxonomy.yaml
          ./ECDAT-${VERSION}-macos-${ARCH}/bin/ecdat scan "${{ github.workspace }}"
          rm -rf "${VALIDATION_DIR}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.info.outputs.arch }}
          path: ECDAT-*-macos-*.tar.gz

  # ---------------------------------------------------------------------------
  # Windows x86_64
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: choco install openssl -y --no-progress

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DECDAT_FETCH_DEPENDENCIES=ON `
            -DECDAT_BUILD_TESTS=ON `
            -DTREE_SITTER_CLI=""
        env:
          OpenSSL_ROOT_DIR: "C:/Program Files/OpenSSL"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep "project(ecdat" CMakeLists.txt -A1 | grep VERSION | sed 's/.*VERSION //' | tr -d ')')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package zip
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="ECDAT-${VERSION}-windows-x86_64"
          mkdir -p "${STAGING}/bin/resources"
          cp build/platform/Release/ecdat.exe "${STAGING}/bin/ecdat.exe"
          cp taxonomy/taxonomy/data/taxonomy.yaml "${STAGING}/bin/resources/taxonomy.yaml"
          # Bundle the exact OpenSSL DLLs the build linked against. The choco
          # 'openssl' package version varies (libcrypto-3-x64.dll, libcrypto-4-x64.dll,
          # ...), so copy every libcrypto-*/libssl-* DLL actually installed and keep
          # their original filenames — never rename between incompatible versions.
          for dll in "C:/Program Files/OpenSSL/bin/"libcrypto-*.dll "C:/Program Files/OpenSSL/bin/"libssl-*.dll; do
            if [ -f "${dll}" ]; then
              cp "${dll}" "${STAGING}/bin/"
            fi
          done
          if ! ls "${STAGING}/bin/"libcrypto-*.dll "${STAGING}/bin/"libssl-*.dll >/dev/null 2>&1; then
            echo "ERROR: no OpenSSL DLLs bundled; ecdat.exe may be missing its runtime"
            ls "C:/Program Files/OpenSSL/bin/" || true
            exit 1
          fi
          7z a -tzip "ECDAT-${VERSION}-windows-x86_64.zip" "${STAGING}/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ECDAT-*-windows-*.zip

  # ---------------------------------------------------------------------------
  # Windows: validate the packaged ZIP on a dedicated runner with OpenSSL
  # stripped from PATH (the image ships it, so we remove its PATH entries).
  # This proves ecdat.exe runs using only the DLLs bundled beside it in the ZIP.
  # ---------------------------------------------------------------------------
  validate-windows:
    needs: build-windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist

      - name: Clean environment (strip OpenSSL from PATH)
        shell: bash
        run: |
          # The windows-2022 image ships OpenSSL and puts its bin directory on
          # PATH. For a true clean-environment test we remove every OpenSSL PATH
          # entry so the packaged ecdat.exe can only resolve libcrypto-*/libssl-*
          # from the ZIP bundle beside it.
          IFS=':' read -r -a entries <<< "$PATH"
          clean=()
          for entry in "${entries[@]}"; do
            case "$entry" in
              *[Oo][Pp][Ee][Nn][Ss][Ss][Ll]*) echo "stripped from PATH: $entry" ;;
              *) clean+=("$entry") ;;
            esac
          done
          IFS=':'
          export PATH="${clean[*]}"
          if printf '%s' "$PATH" | grep -iq openssl; then
            echo "FAIL: OpenSSL still on PATH after stripping"
            exit 1
          fi
          echo "OK: OpenSSL stripped from PATH; bundled DLLs must satisfy the runtime"

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep "project(ecdat" CMakeLists.txt -A1 | grep VERSION | sed 's/.*VERSION //' | tr -d ')')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unpack and run real scan
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd dist
          7z x "ECDAT-${VERSION}-windows-x86_64.zip"
          # Fail loudly if the ZIP is missing its bundled OpenSSL DLLs.
          ls "ECDAT-${VERSION}-windows-x86_64/bin/"libcrypto-*.dll >/dev/null 2>&1
          ls "ECDAT-${VERSION}-windows-x86_64/bin/"libssl-*.dll >/dev/null 2>&1
          cd "ECDAT-${VERSION}-windows-x86_64/bin"
          ./ecdat.exe --version
          test -f resources/taxonomy.yaml
          ./ecdat.exe scan "${{ github.workspace }}"

  # ---------------------------------------------------------------------------
  # Final: collect artifacts, generate checksums, publish release
  # ---------------------------------------------------------------------------
  publish:
    needs: [build-linux, build-macos, validate-windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
